<script>
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem("health-dash:" + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem("health-dash:" + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem("health-dash:" + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage)
        .filter((k) => k.startsWith("health-dash:" + (prefix || "")))
        .map((k) => k.replace("health-dash:", ""));
      return { keys, prefix, shared: false };
    },
  };
</script>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4a7Sbu6D_kustd0GR1L-1EjW_ApGuEbP0LCVHtL8OaAH3-fNorGbFAGu_tdW_2gPh5w/exec";

// Loads the current shared state blob (stats + loggedByDay + logsByDate + healthData) from the backend.
async function fetchBackendState() {
  const res = await fetch(APPS_SCRIPT_URL);
  if (!res.ok) throw new Error(`Backend fetch failed (${res.status}).`);
  const text = await res.text();
  return JSON.parse(text || "{}");
}

// Overwrites the shared state blob on the backend with the full current picture.
// Uses text/plain on purpose — application/json would trigger a CORS preflight
// (an OPTIONS request) that Apps Script doesn't handle, breaking the save silently.
async function pushBackendState(data) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      secret: APPS_SCRIPT_SECRET,
      data
    })
  });
  if (!res.ok) throw new Error(`Backend save failed (${res.status}).`);
  const result = JSON.parse(await res.text());
  if (result.error) throw new Error(result.error);
  return result;
}

// The ONLY safe way to write a partial update (e.g. just the new stats, or just an
// updated logsByDate). pushBackendState does a full overwrite with no server-side
// merge, so writing local-only fields directly would silently erase anything not
// included — e.g. healthData, which none of the dashboard's own save actions know
// about. This fetches the absolute latest backend state first and layers the partial
// update on top of it, so nothing already saved (by Sync, by another device, by a
// Cowork push) is ever dropped.
async function mergeAndPushBackendState(partial) {
  const fresh = await fetchBackendState();
  const merged = {
    ...fresh,
    ...partial
  };
  await pushBackendState(merged);
  return merged;
}

// Parses a Garmin-style duration string ("8h 9m", "6h 40m", "45m") into total minutes.
// Returns null if it can't parse anything usable, rather than guessing.
function parseDurationToMinutes(str) {
  if (!str) return null;
  const hMatch = str.match(/(\d+)\s*h/);
  const mMatch = str.match(/(\d+)\s*m/);
  if (!hMatch && !mMatch) return null;
  return (hMatch ? parseInt(hMatch[1], 10) * 60 : 0) + (mMatch ? parseInt(mMatch[1], 10) : 0);
}
